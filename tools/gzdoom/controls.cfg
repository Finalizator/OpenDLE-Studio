// Keys that GZDoom's default layout leaves unbound, so that every obvious key works.
//
// `defbinds.txt` - what GZDoom uses unless told otherwise - binds only W/A/S/D and no arrow
// keys at all, so pressing Left, Right or Down does nothing whatsoever. This file fills those
// gaps and nothing else.
//
// `GZDoom.sh` only loads this file when the config it is about to use has no arrow binds, so
// it runs once on a fresh install and never again: a layout you change in the options menu
// stays yours. (`defaultbind` would be the obvious way to do that in the file itself, but it
// refuses to bind a key when its command is already on another key, which is exactly the case
// for the arrows - `+forward` is already on W - so Up and Down were silently skipped.)
//
// Movement, both layouts at once
bind W "+forward"
bind S "+back"
bind A "+moveleft"
bind D "+moveright"
bind Uparrow "+forward"
bind Downarrow "+back"
bind Leftarrow "+left"
bind Rightarrow "+right"
bind , "+moveleft"
bind . "+moveright"

// Run, strafe modifier, look up and down
bind Shift "+speed"
bind Alt "+strafe"
bind Capslock "toggle cl_run"
bind Pgdn "+lookup"
bind End "centerview"
bind Pgup "+moveup"
bind Ins "+movedown"

// Doing things
bind Space "+jump"
bind E "+use"
bind Ctrl "+attack"
bind X "+crouch"
bind Mouse1 "+attack"
bind Mouse2 "+altattack"
bind Mouse3 "+forward"

// Weapons and the map, on the keys people reach for first
bind Mwheelup "weapprev"
bind Mwheeldown "weapnext"
bind Q "weapprev"
bind R "weapnext"
