<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>OpenDLE game</title>
<link rel="stylesheet" href="/hud.css">
<link rel="stylesheet" href="./game.css">
<!-- The engine modules import Three by bare name, exactly as the editor does. -->
<script type="importmap">
  {"imports":{"three":"/vendor/three/three.webgpu.js","three/webgpu":"/vendor/three/three.webgpu.js","three/tsl":"/vendor/three/three.tsl.js","three/addons/":"/vendor/three-addons/"}}
</script>
</head>
<body>
<div id="app">
  <canvas id="view" tabindex="0" aria-label="Game view"></canvas>
  <!-- The game's own HUD and menus are drawn here, by the engine, from the project. -->
  <div id="hud" aria-live="off"></div>
  <p id="message" hidden></p>

  <!-- The splash the game shows while its 3D view comes up: the OpenDLE mark, the stage it is at,
       and a progress bar that actually moves. -->
  <div id="loading">
    <div class="splash">
      <svg class="splash-mark" viewBox="0 0 128 128" aria-hidden="true">
        <rect width="128" height="128" rx="24" fill="#101418"></rect>
        <path d="M25 25h47l31 39-31 39H25V25zm17 17v44h22l18-22-18-22H42z" fill="#62b4ed"></path>
      </svg>
      <p class="splash-word">OpenDLE</p>
      <p class="splash-tag">a local-first game engine</p>
      <div class="bar" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>
      <span id="loading-text">Loading the game…</span>
    </div>
  </div>
  <div id="fatal" hidden>
    <div class="frame" role="alertdialog" aria-labelledby="fatal-title">
      <p class="kicker">OpenDLE</p>
      <h1 id="fatal-title">The game could not start</h1>
      <p id="fatal-message"></p>
      <p id="fatal-hint" class="hint"></p>
    </div>
  </div>
  <p id="toast" role="status" hidden></p>
</div>
<!-- Where the project data lives, relative to this page. The build writes this file. -->
<script type="application/json" id="game-config">{"data":"data/"}</script>
<script type="module" src="./game.js"></script>
</body>
</html>
